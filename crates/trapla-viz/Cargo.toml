[package]
name = "trapla-viz"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "trapla 可视化：Bevy 3D 地形 + 落足点回放 + 指标面板（含无头自检与截图）"

[[bin]]
name = "trapla-viz"
path = "src/main.rs"

[dependencies]
bevy = { version = "0.20.0", features = ["system_font_discovery"] }
clap = { version = "4", features = ["derive"] }
serde_json = "1"
